timeout: 0
quiet: yes

# Boot parameters: to start already connected to an AI on a real PC, add a
# line like this under the entry below (on the USB stick: boot/limine/limine.conf):
#     cmdline: os.provider=anthropic os.key=YOUR-KEY os.model=claude-opus-5-5
# os.url= sets a custom address (local servers). In a VM, use os.conf instead.

/Operating System
    protocol: limine
    resolution: 1600x900
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/base.cpio
    module_path: boot():/boot/initrd.cpio
