<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="prism-gadget://_sdk/base.css">
<link rel="stylesheet" href="prism-gadget://_sdk/kit.css">
<script src="prism-gadget://_sdk/prism.js"></script>
<script src="prism-gadget://_sdk/kit.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--text) 10%, transparent) }
  .bar input { flex: 1 1 140px; min-width: 0 }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; cursor: pointer; border: 1px solid color-mix(in srgb, var(--text) 18%, transparent); background: transparent; color: var(--text) }
  .chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent) }
  .item { display: flex; gap: 8px; align-items: baseline; padding: 8px 10px; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--text) 6%, transparent); min-width: 0 }
  .item:hover { background: color-mix(in srgb, var(--text) 5%, transparent) }
  .num { color: var(--muted, #888); font-variant-numeric: tabular-nums; flex: none }
  .ttl { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .meta { flex: none; font-size: 11px; opacity: .6 }
  .lab { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 22%, transparent); margin-left: 4px; white-space: nowrap }
  .detail { padding: 12px; overflow: auto }
  .detail h2 { margin: 4px 0 6px; font-size: 16px; overflow-wrap: anywhere }
  .text { line-height: 1.5; overflow-wrap: anywhere }
  .text code { background: color-mix(in srgb, var(--text) 8%, transparent); padding: 0 4px; border-radius: 4px }
  .text a.ref { color: var(--accent); cursor: pointer; text-decoration: underline }
  .note { border-left: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); padding: 4px 10px; margin: 8px 0 }
  .note .who { font-size: 11px; opacity: .6 }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 }
  textarea, input { width: 100%; min-width: 0; font: inherit; color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); border: 1px solid color-mix(in srgb, var(--text) 15%, transparent); border-radius: 6px; padding: 6px 8px }
  textarea { min-height: 70px; resize: vertical }
  .section { margin-top: 14px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; opacity: .6 }
  .commit { font-size: 12px; padding: 3px 0; display: flex; gap: 6px; min-width: 0 }
  .commit .h { font-family: var(--mono, monospace); flex: none; opacity: .8 }
  .commit .w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .status { font-size: 11px; padding: 1px 8px; border-radius: 8px }
  .status.open { background: color-mix(in srgb, var(--amber, #d9a) 30%, transparent) }
  .status.resolved { background: color-mix(in srgb, var(--mint, #7c9) 30%, transparent) }
  .empty { padding: 30px 16px; text-align: center; opacity: .6 }
  select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid color-mix(in srgb, var(--text) 15%, transparent); border-radius: 6px; padding: 4px; max-width: 100% }
  /* the second opinion */
  .rev-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid color-mix(in srgb, var(--text) 6%, transparent) }
  .rev-bar select { flex: 1 1 160px; min-width: 0 }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 8px; white-space: nowrap; flex: none }
  .badge.run { background: color-mix(in srgb, var(--accent) 30%, transparent); animation: breathe 1.6s ease-in-out infinite }
  .badge.ok { background: color-mix(in srgb, var(--mint, #7c9) 30%, transparent) }
  .badge.warn { background: color-mix(in srgb, var(--amber, #d9a) 35%, transparent) }
  .rcard { position: relative; overflow: hidden; border-radius: 10px; padding: 10px 12px; margin: 10px 0;
           background: color-mix(in srgb, var(--accent) 9%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent) }
  .rcard.ok { background: color-mix(in srgb, var(--mint, #7c9) 10%, transparent); border-color: color-mix(in srgb, var(--mint, #7c9) 35%, transparent) }
  .rcard.warn { background: color-mix(in srgb, var(--amber, #d9a) 10%, transparent); border-color: color-mix(in srgb, var(--amber, #d9a) 40%, transparent) }
  .rcard.fail { background: color-mix(in srgb, var(--rose, #d77) 10%, transparent); border-color: color-mix(in srgb, var(--rose, #d77) 35%, transparent) }
  .rcard .rtop { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; min-width: 0 }
  .rcard .rwho { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .rcard .rwhere { font-size: 11px; opacity: .65 }
  .rcard .rgrow { flex: 1 }
  .rcard .rtime { font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums }
  .rsteps { display: flex; gap: 4px; margin: 10px 0 6px; flex-wrap: wrap }
  .rstep { flex: 1 1 90px; font-size: 11px; padding: 4px 6px; border-radius: 6px; opacity: .45; background: color-mix(in srgb, var(--text) 5%, transparent); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .rstep.done { opacity: .75 }
  .rstep.now { opacity: 1; background: color-mix(in srgb, var(--accent) 22%, transparent) }
  .rdoing { font-size: 12px; opacity: .85; min-height: 1.3em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .rstream { font-size: 12px; opacity: .7; max-height: 5.6em; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px;
             -webkit-mask-image: linear-gradient(to bottom, transparent, #000 35%) }
  .rcard .rline { position: absolute; left: 0; bottom: 0; height: 2px; width: 35%; background: var(--accent); opacity: .7; animation: sweep 1.8s ease-in-out infinite }
  .rlist { margin: 6px 0 0; padding-left: 16px; font-size: 12px }
  .rlist li { margin: 2px 0; overflow-wrap: anywhere }
  @keyframes sweep { 0% { transform: translateX(-100%) } 100% { transform: translateX(290%) } }
  @keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .rcard .rline, .badge.run { animation: none } .rcard .rline { display: none } }
</style>
</head>
<body>
<div class="k-app">
  <div class="k-top"><div class="k-title">Issues</div><div class="k-grow"></div><span class="dim" style="font-size:11px">on this computer only</span></div>
  <div id="view" class="k-body" style="padding:0"></div>
</div>
<script>
const { h, mount, ago } = window.kit
let tab = 'open', label = '', q = '', open = null, all = [], labelList = []

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
// a little Markdown: paragraphs, `code`, **bold**, and file:line references that open the file
function md(s) {
  return esc(s || '').split(/\n{2,}/).map((p) => '<p>' + p
    .replace(/`([^`]+)`/g, (m, c) => /^[\w./-]+\.[a-z]+(:\d+)?$/i.test(c) ? `<a class="ref" data-path="${c}"><code>${c}</code></a>` : `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])((?:[\w-]+\/)+[\w.-]+\.(?:c|h|inc|mjs|js|ts|py|md|json|xml|sh|ps1|S)(?::\d+)?)/g, (m, pre, path) => `${pre}<a class="ref" data-path="${path}">${path}</a>`)
    .replace(/\n/g, '<br>') + '</p>').join('')
}
function hookRefs(el) {
  el.querySelectorAll('a.ref').forEach((a) => a.onclick = () => prism.ui.openFile(a.dataset.path.replace(/:\d+$/, '')))
}
const when = (iso) => iso ? ago(Date.parse(iso)) : ''

// ---- the second opinion ----
let reviewing = {}, modelInfo = { available: false, models: [] }, reviewerKey = '', cardEl = null, cardFor = 0
async function loadReviewState() {
  try {
    modelInfo = await prism.call('models')
    reviewerKey = (await prism.call('reviewer')).key
    for (const r of await prism.call('reviews')) reviewing[r.id] = r
  } catch (e) { modelInfo = { available: false, models: [] } }
}
function reviewerLabel() {
  const m = modelInfo.models.find((x) => x.key === reviewerKey)
  return m ? m.label : reviewerKey ? reviewerKey.split('::').pop() : ''
}
function reviewBar() {
  if (!modelInfo.available)
    return h('div', { class: 'rev-bar dim' }, 'Second opinion: needs Prism 0.24.42 or later (restart Prism to update).')
  const local = modelInfo.models.filter((m) => m.local), remote = modelInfo.models.filter((m) => !m.local)
  const opt = (m) => h('option', { value: m.key, ...(m.key === reviewerKey ? { selected: 'selected' } : {}) }, `${m.label} (${m.provider})`)
  const sel = h('select', { title: 'Which of your models reviews each fix' },
    h('option', { value: '' }, 'Off'),
    local.length ? h('optgroup', { label: 'On this PC' }, ...local.map(opt)) : '',
    remote.length ? h('optgroup', { label: 'Online' }, ...remote.map(opt)) : '')
  sel.onchange = async () => { reviewerKey = (await prism.call('setReviewer', { key: sel.value })).key; window.kit.toast(reviewerKey ? `Fixes will be reviewed by ${reviewerLabel()}` : 'No second opinion') }
  return h('div', { class: 'rev-bar' }, h('span', {}, 'Second opinion'), sel)
}
const STEPS = [['handed', 'Handed the fix'], ['reading', 'Reading the change'], ['writing', 'Writing its review']]
// a review's text in its parts: the verdict, what it looked at, its points
function sections(t) {
  const part = (name) => { const m = new RegExp(name + ':\\s*\\n([\\s\\S]*?)(?=\\n[A-Z ]+:\\s*\\n|$)', 'i').exec(t || ''); return m ? m[1].split('\n').map((l) => l.replace(/^\s*[-*]\s*/, '').trim()).filter(Boolean) : [] }
  const v = /VERDICT:\s*(looks right|concerns)/i.exec(t || '')
  return { verdict: v ? v[1].toLowerCase() : '', looked: part('LOOKED AT'), points: part('POINTS') }
}
function listOf(items) {
  const ul = h('ul', { class: 'rlist' })
  for (const it of items) { const li = h('li', {}); li.innerHTML = md(it).replace(/^<p>|<\/p>$/g, ''); hookRefs(li); ul.appendChild(li) }
  return ul
}
function renderCard(r) {
  if (!cardEl) return
  if (!r) { cardEl.replaceChildren(); return }
  const secs = Math.max(0, Math.round((Date.now() - r.started) / 1000))
  const time = secs < 60 ? `${secs}s` : `${Math.floor(secs / 60)}m ${secs % 60}s`
  const where = r.local ? 'on this PC' : 'online'
  if (!r.done) {
    const now = STEPS.findIndex(([k]) => k === r.stage)
    const steps = STEPS.map(([k, l], n) => h('div', { class: 'rstep' + (n < now ? ' done' : n === now ? ' now' : ''), title: l }, l))
    const stop = h('button', {}, 'Stop')
    stop.onclick = () => prism.call('cancelReview', { id: r.id })
    const kids = [h('div', { class: 'rtop' }, h('span', { class: 'rwho' }, `Reviewing: ${r.label}`), h('span', { class: 'rwhere' }, where), h('span', { class: 'rgrow' }), h('span', { class: 'rtime' }, time), stop),
      h('div', { class: 'rsteps' }, ...steps), h('div', { class: 'rdoing', title: r.doing }, r.doing || '')]
    if (r.text) kids.push(h('div', { class: 'rstream' }, r.text.slice(-600)))
    kids.push(h('div', { class: 'rline' }))
    cardEl.replaceChildren(h('div', { class: 'rcard' }, ...kids))
    return
  }
  if (r.stage === 'failed') {
    cardEl.replaceChildren(h('div', { class: 'rcard fail' }, h('div', { class: 'rtop' }, h('span', { class: 'rwho' }, `${r.label} couldn't review it`), h('span', { class: 'rgrow' }), h('span', { class: 'rtime' }, time)),
      h('div', { class: 'rdoing' }, r.error || '')))
    return
  }
  cardEl.replaceChildren(reviewCard(r.label, where, r.text, time))
}
function reviewCard(label, where, text, time) {
  const s = sections(text), concerns = s.verdict === 'concerns'
  const kids = [h('div', { class: 'rtop' }, h('span', { class: 'rwho' }, `Reviewed by ${label}`), where ? h('span', { class: 'rwhere' }, where) : '', h('span', { class: 'rgrow' }),
    h('span', { class: 'badge ' + (concerns ? 'warn' : 'ok') }, concerns ? 'concerns' : 'looks right'), time ? h('span', { class: 'rtime' }, time) : '')]
  if (s.looked.length) kids.push(h('div', { class: 'section', style: 'margin-top:8px' }, 'What it looked at'), listOf(s.looked))
  if (s.points.length) kids.push(h('div', { class: 'section', style: 'margin-top:8px' }, 'Its points'), listOf(s.points))
  if (!s.looked.length && !s.points.length) { const t = h('div', { class: 'text', style: 'font-size:12px' }); t.innerHTML = md(text); hookRefs(t); kids.push(t) }
  return h('div', { class: 'rcard ' + (concerns ? 'warn' : 'ok') }, ...kids)
}
prism.on('review', (r) => {
  reviewing[r.id] = r
  if (open === r.id) renderCard(r)
  else if (!open) { /* the list: its "reviewing" badge put on or taken off */
    const shown = !!document.querySelector(`[data-issue="${r.id}"] .badge.run`)
    if (shown !== !r.done) showList()
  }
})
setInterval(() => { const r = open && reviewing[open]; if (r && !r.done) renderCard(r) }, 1000) /* (its clock) */

async function load() {
  all = await prism.call('list', { status: tab, label, q })
  labelList = await prism.call('labels')
  open ? showIssue(open) : showList()
}

function showList() {
  open = null
  const v = document.getElementById('view')
  const search = h('input', { placeholder: 'Search', value: q })
  search.oninput = () => { q = search.value; clearTimeout(search.t); search.t = setTimeout(load, 250) }
  const tabs = ['open', 'resolved', 'all'].map((t) => { const b = h('button', { class: 'chip' + (tab === t ? ' on' : '') }, t === 'open' ? 'Open' : t === 'resolved' ? 'Resolved' : 'All'); b.onclick = () => { tab = t; load() }; return b })
  const add = h('button', { class: 'primary' }, 'New issue')
  add.onclick = showNew
  const chips = labelList.map((l) => { const b = h('button', { class: 'chip' + (label === l ? ' on' : '') }, l); b.onclick = () => { label = label === l ? '' : l; load() }; return b })
  const items = all.length ? all.map((i) => {
    const r = reviewing[i.id]
    const it = h('div', { class: 'item', 'data-issue': String(i.id) }, h('span', { class: 'num' }, '#' + i.id), h('span', { class: 'ttl', title: i.title }, i.title),
      r && !r.done ? h('span', { class: 'badge run' }, 'reviewing') : '',
      ...i.labels.slice(0, 3).map((l) => h('span', { class: 'lab' }, l)), h('span', { class: 'meta' }, i.status === 'resolved' ? 'resolved ' + when(i.resolved) : when(i.created)))
    it.onclick = () => showIssue(i.id)
    return it
  }) : [h('div', { class: 'empty' }, q || label ? 'Nothing matches.' : tab === 'open' ? 'No open issues.' : 'None yet.')]
  mount(v, h('div', { class: 'bar' }, ...tabs, search, add), reviewBar(), h('div', { class: 'chips' }, ...chips), ...items)
}

function showNew() {
  const v = document.getElementById('view')
  const title = h('input', { placeholder: 'What is wrong, in a few words' })
  const text = h('textarea', { placeholder: 'What happens, how to see it, and where (a file:line opens the file)' })
  const labs = h('input', { placeholder: 'Labels, with commas (bug, kernel, desktop...)' })
  const save = h('button', { class: 'primary' }, 'File it'), back = h('button', {}, 'Cancel')
  back.onclick = showList
  save.onclick = async () => {
    try { const i = await prism.call('create', { title: title.value, text: text.value, labels: labs.value, by: 'Valerie' }); open = i.id; await load() }
    catch (e) { window.kit.toast(String(e.message || e)) }
  }
  mount(v, h('div', { class: 'detail' }, h('h2', {}, 'New issue'), title, h('div', { style: 'height:6px' }), text, h('div', { style: 'height:6px' }), labs, h('div', { class: 'row' }, save, back)))
  title.focus()
}

async function showIssue(id) {
  open = id
  const i = await prism.call('details', { id })
  const v = document.getElementById('view')
  const back = h('button', {}, '← All issues')
  back.onclick = () => { open = null; load() }
  const body = h('div', { class: 'text' }); body.innerHTML = md(i.text) || '<p class="dim">No description.</p>'; hookRefs(body)
  const notes = i.notes.map((n) => {
    if (/^Review by /.test(n.by)) /* a second opinion: shown as its card */
      return h('div', {}, reviewCard(n.by.replace(/^Review by /, ''), '', n.text, when(n.when)))
    const t = h('div', { class: 'text' }); t.innerHTML = md(n.text); hookRefs(t); return h('div', { class: 'note' }, h('div', { class: 'who' }, `${n.by} · ${when(n.when)}`), t)
  })
  cardEl = h('div', {})
  cardFor = id
  const live = reviewing[id]
  const noteBox = h('textarea', { placeholder: 'Add a note' })
  const addNote = h('button', {}, 'Add note')
  addNote.onclick = async () => { if (!noteBox.value.trim()) return; await prism.call('note', { id, text: noteBox.value, by: 'Valerie' }); showIssue(id) }
  const labs = h('input', { value: i.labels.join(', ') })
  const saveLabs = h('button', {}, 'Save labels')
  saveLabs.onclick = async () => { await prism.call('setLabels', { id, labels: labs.value, by: 'Valerie' }); showIssue(id) }
  let act
  if (i.status === 'open') {
    const recent = await prism.call('recentCommits')
    const pick = h('select', {}, h('option', { value: '' }, 'Fixed by... (optional)'), ...recent.map((c) => h('option', { value: c.hash }, `${c.hash} ${c.what.slice(0, 60)}`)))
    const res = h('button', { class: 'primary' }, 'Resolve')
    res.onclick = async () => { await prism.call('resolve', { id, commit: pick.value, text: noteBox.value, by: 'Valerie' }); noteBox.value = ''; showIssue(id) }
    act = h('div', { class: 'row' }, pick, res)
  } else {
    const re = h('button', {}, 'Reopen')
    re.onclick = async () => { await prism.call('reopen', { id, text: noteBox.value, by: 'Valerie' }); showIssue(id) }
    const ask = h('button', {}, reviewerKey ? `Review this fix (${reviewerLabel()})` : 'Review this fix')
    ask.onclick = async () => {
      if (!reviewerKey) { window.kit.toast('Choose a model under "Second opinion" first (in the list of issues).'); return }
      try { await prism.call('review', { id }) } catch (e) { window.kit.toast(String(e.message || e)) }
    }
    act = h('div', { class: 'row' }, re, modelInfo.available && (i.fixed_by || i.commits.length) && !(live && !live.done) ? ask : '')
  }
  const commits = i.commits.map((c) => h('div', { class: 'commit' }, h('span', { class: 'h' }, c.hash), h('span', { class: 'w', title: c.what }, (c.fixed ? 'fixed it: ' : '') + c.what)))
  const hist = i.history.map((c) => h('div', { class: 'commit' }, h('span', { class: 'h' }, when(c.when)), h('span', { class: 'w', title: c.what }, `${c.what} (${c.by})`)))
  mount(v, h('div', { class: 'detail' },
    h('div', { class: 'row', style: 'margin:0 0 6px' }, back),
    h('div', {}, h('span', { class: 'num' }, '#' + i.id + ' '), h('span', { class: 'status ' + i.status }, i.status === 'open' ? 'open' : 'resolved'), ...i.labels.map((l) => h('span', { class: 'lab' }, l))),
    h('h2', {}, i.title),
    h('div', { class: 'dim', style: 'font-size:11px' }, `filed by ${i.by || 'someone'} ${when(i.created)}`),
    cardEl,
    body,
    i.notes.length ? h('div', { class: 'section' }, 'Notes') : '', ...notes,
    h('div', { class: 'section' }, 'Add to it'), noteBox, h('div', { class: 'row' }, addNote), act,
    h('div', { class: 'section' }, 'Labels'), h('div', { class: 'row' }, labs, saveLabs),
    commits.length ? h('div', { class: 'section' }, 'Commits') : '', ...commits,
    h('div', { class: 'section' }, 'History'), ...hist))
  /* a review going on now (or just ended, before its note is read back) shows at the top */
  if (live && (!live.done || live.stage === 'failed')) renderCard(live)
}

prism.ready(async () => { await loadReviewState(); load() })
prism.on('models', async () => { await loadReviewState(); if (!open) showList() })
prism.on('changed', () => load())
</script>
</body>
</html>
